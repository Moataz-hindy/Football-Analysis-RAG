<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Touchline Intelligence | Multi-Agent Football Analytics & Deliberation Platform" />
    <title>Touchline Intelligence - Tactical Multi-Agent Deliberation</title>

    <!-- Google Fonts & Phosphor Icons (Claude Nocturne Design System) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- Tailwind CSS (for layout utilities) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --color-bg: #0b0e17;
        --color-surface: #141724;
        --color-text: #e9e9ed;
        --color-accent: #00f59b;
        --color-accent-100: #cdffdc;
        --color-accent-200: #85ffbe;
        --color-accent-300: #00f59b;
        --color-accent-400: #00d2ff;
        --color-accent-700: #008f53;
        --color-accent-800: #005a33;
        --color-accent-900: #00361e;
        --color-divider: color-mix(in srgb, #e9e9ed 14%, transparent);

        --color-neutral-100: #f3f5fe;
        --color-neutral-200: #e4e7f5;
        --color-neutral-300: #cfd3e5;
        --color-neutral-400: #b2b6ca;
        --color-neutral-500: #9397ab;
        --color-neutral-600: #75798c;
        --color-neutral-700: #595d6c;
        --color-neutral-800: #3f424d;
        --color-neutral-900: #292b31;

        --font-heading: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        --font-body: 'Inter', system-ui, sans-serif;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 14px;
      }

      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }

      a {
        color: var(--color-accent-300);
        text-decoration: none;
      }
      a:hover {
        color: var(--color-accent-100);
      }

      @keyframes tiPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @keyframes tiIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* — Claude Nocturne Buttons — */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        text-decoration: none;
        font-family: var(--font-heading);
        font-weight: 500;
        font-size: 14px;
        line-height: 1.2;
        color: var(--color-text);
        background: transparent;
        border: 1px solid transparent;
        padding: 8px 16px;
        border-radius: var(--radius-md);
        transition: all 0.15s ease;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-primary {
        color: #00361e;
        background: var(--color-accent);
        border-color: var(--color-accent);
        font-weight: 600;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--color-accent-200);
        border-color: var(--color-accent-200);
        box-shadow: 0 0 16px color-mix(in srgb, var(--color-accent) 45%, transparent);
      }
      .btn-secondary {
        border-color: var(--color-divider);
        background: color-mix(in srgb, var(--color-surface) 60%, transparent);
        color: var(--color-neutral-200);
      }
      .btn-secondary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-text) 9%, transparent);
        color: var(--color-neutral-100);
        border-color: color-mix(in srgb, var(--color-text) 25%, transparent);
      }
      .btn-ghost {
        color: var(--color-accent);
        padding-inline: 8px;
      }
      .btn-ghost:hover:not(:disabled) {
        background: color-mix(in srgb, var(--color-accent) 12%, transparent);
      }
      .btn-icon {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: var(--radius-md);
      }

      /* — Tags — */
      .tag {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        letter-spacing: 0.02em;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .tag-accent {
        background: var(--color-accent-900);
        border: 1px solid var(--color-accent-800);
        color: var(--color-accent-200);
      }
      .tag-neutral {
        background: color-mix(in srgb, var(--color-neutral-800) 80%, transparent);
        border: 1px solid var(--color-divider);
        color: var(--color-neutral-200);
      }

      ::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
